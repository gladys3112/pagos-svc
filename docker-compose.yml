services:
  pagos-svc:
    image: pagos-svc:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: default
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 200
