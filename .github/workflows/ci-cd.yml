name: CI/CD - pagos-svc

on:
  push:
    branches: [main, develop, "feature/**", "hotfix/**"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pagos-svc-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Pruebas y cobertura
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Configurar Java 21 y caché Maven
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Ejecutar pruebas y verificación de cobertura
        run: ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: Guardar informe JaCoCo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informe-jacoco
          path: target/site/jacoco/
          if-no-files-found: warn
          retention-days: 14

  dependabot:
    name: Verificación de Dependabot
    runs-on: ubuntu-latest
    permissions:
      contents: read
      vulnerability-alerts: read
    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Confirmar configuración de Dependabot
        run: test -f .github/dependabot.yml

      - name: Consultar alertas de Dependabot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/${GITHUB_REPOSITORY}/dependabot/alerts?state=open&per_page=100" --jq '.[].number' > dependabot-alerts-open.txt
          echo "Alertas abiertas consultadas: $(wc -l < dependabot-alerts-open.txt)"

  security:
    name: Análisis de seguridad con Trivy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Analizar dependencias y archivos con Trivy
        run: |
          docker run --rm -v "$PWD:/work:ro" aquasec/trivy:0.67.2 fs \
            --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 /work

  sonar-analysis:
    name: Análisis estático SonarCloud
    if: ${{ vars.SONAR_ORGANIZATION != '' && vars.SONAR_PROJECT_KEY != '' }}
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Obtener código con historial completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Ejecutar análisis SonarCloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
        run: |
          test -n "$SONAR_TOKEN" || (echo "Falta configurar el secreto SONAR_TOKEN" && exit 1)
          ./mvnw --batch-mode --no-transfer-progress verify org.sonarsource.scanner.maven:sonar-maven-plugin:5.8.0.7211:sonar \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.scanner.skipJreProvisioning=true \
            -Dsonar.qualitygate.wait=true \
            -Dsonar.organization="$SONAR_ORGANIZATION" \
            -Dsonar.projectKey="$SONAR_PROJECT_KEY"

      - name: Consultar vulnerabilidades de SonarCloud en código nuevo
        if: always()
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_PULL_REQUEST: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "$SONAR_TOKEN" ] || [ -z "$SONAR_PROJECT_KEY" ] || [ -z "$SONAR_PULL_REQUEST" ]; then
            echo "No hay contexto suficiente para consultar los hallazgos del pull request."
            exit 0
          fi
          curl --fail --silent --show-error --user "$SONAR_TOKEN:" --get \
            --data-urlencode "componentKeys=$SONAR_PROJECT_KEY" \
            --data-urlencode "pullRequest=$SONAR_PULL_REQUEST" \
            --data-urlencode "sinceLeakPeriod=true" \
            --data-urlencode "types=VULNERABILITY" \
            --data-urlencode "resolved=false" \
            --data-urlencode "ps=100" \
            https://sonarcloud.io/api/issues/search |
            jq -r 'if (.issues | length) == 0 then "No se encontraron vulnerabilidades abiertas en código nuevo." else .issues[] | [.severity, .component, (.line // "-"), .rule, .message] | @tsv end'

  snyk-analysis:
    name: Análisis de dependencias con Snyk
    if: ${{ vars.ENABLE_SNYK == 'true' }}
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Configurar Java 21 y caché Maven
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Ejecutar análisis Snyk para Maven
        uses: snyk/actions/maven-3-jdk-21@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high

  analysis-gate:
    name: Puerta de análisis IE3
    if: always()
    needs: [sonar-analysis, snyk-analysis]
    runs-on: ubuntu-latest
    steps:
      - name: Exigir un análisis estático exitoso
        env:
          SONAR_RESULT: ${{ needs.sonar-analysis.result }}
          SNYK_RESULT: ${{ needs.snyk-analysis.result }}
        run: |
          if [ "$SONAR_RESULT" = "success" ] || [ "$SNYK_RESULT" = "success" ]; then
            echo "Al menos uno de SonarCloud o Snyk terminó correctamente."
          else
            echo "No terminó correctamente ningún análisis requerido: SonarCloud=$SONAR_RESULT, Snyk=$SNYK_RESULT"
            exit 1
          fi

  build-and-scan:
    name: Construcción y análisis de imagen Docker
    needs: [test, security, dependabot, analysis-gate]
    if: ${{ always() && needs.test.result == 'success' && needs.security.result == 'success' && needs.dependabot.result == 'success' && needs.analysis-gate.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Construir imagen del microservicio
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          load: true
          tags: pagos-svc:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Analizar vulnerabilidades de la imagen
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$HOME/.cache:/root/.cache" \
            aquasec/trivy:0.67.2 image --scanners vuln --severity HIGH,CRITICAL \
            --ignore-unfixed --exit-code 1 pagos-svc:${{ github.sha }}

  deploy-simulated:
    name: Despliegue simulado y smoke tests
    needs: [build-and-scan]
    if: ${{ always() && needs.build-and-scan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Construir imagen para el runner de despliegue
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          load: true
          tags: pagos-svc:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Desplegar en entorno temporal con Docker Compose
        env:
          IMAGE_TAG: ${{ github.sha }}
          PORT: '8080'
          POSTGRES_DB: pagosdb
          POSTGRES_USER: pagos
          POSTGRES_PASSWORD: pagos_ci
        run: |
          docker compose up -d
          echo "Esperando el healthcheck del contenedor..."
          for attempt in $(seq 1 30); do
            status="$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$(docker compose ps -q pagos-svc)" 2>/dev/null || true)"
            if [ "$status" = "healthy" ]; then
              echo "Healthcheck correcto."
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "La aplicación no quedó healthy."
              docker compose ps
              docker compose logs
              exit 1
            fi
            sleep 3
          done
          curl --fail --silent --show-error http://localhost:8080/ > /dev/null
          created="$(curl --fail --silent --show-error -H 'Content-Type: application/json' \
            -d '{"nombre":"Pago CI","orden":"CI-${GITHUB_SHA:0:7}","monto":1.00,"estado":"APROBADO"}' \
            http://localhost:8080/api/pagos)"
          echo "$created"
          list="$(curl --fail --silent --show-error http://localhost:8080/api/pagos)"
          echo "$list"
          printf '%s' "$list" | grep -q '"nombre":"Pago CI"'
          echo "Despliegue simulado correcto para commit ${{ github.sha }}"

      - name: Guardar logs y estado del despliegue
        if: always()
        env:
          IMAGE_TAG: ${{ github.sha }}
          DB_IMAGE_TAG: ${{ github.sha }}
          PORT: '8080'
          POSTGRES_DB: pagosdb
          POSTGRES_USER: pagos
          POSTGRES_PASSWORD: pagos_ci
        run: |
          docker compose ps > deployment-status.txt 2>&1 || true
          docker compose logs --no-color > deployment-logs.txt 2>&1 || true

      - name: Publicar evidencias del despliegue
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencia-despliegue-${{ github.sha }}
          path: |
            deployment-status.txt
            deployment-logs.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Detener entorno temporal
        if: always()
        env:
          IMAGE_TAG: ${{ github.sha }}
          DB_IMAGE_TAG: ${{ github.sha }}
          PORT: '8080'
          POSTGRES_DB: pagosdb
          POSTGRES_USER: pagos
          POSTGRES_PASSWORD: pagos_ci
        run: docker compose down --volumes --remove-orphans
