name: CI/CD - pagos-svc

on:
  push:
    branches: [main, develop, "feature/**", "hotfix/**"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pagos-svc-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Pruebas y cobertura
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Configurar Java 21 y caché Maven
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Ejecutar pruebas y verificación de cobertura
        run: ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: Guardar informe JaCoCo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informe-jacoco
          path: target/site/jacoco/
          if-no-files-found: warn
          retention-days: 14

  security:
    name: Análisis de seguridad
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Analizar dependencias y archivos con Trivy
        run: |
          docker run --rm -v "$PWD:/work:ro" aquasec/trivy:0.67.2 fs \
            --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 /work

  build-and-deploy-simulated:
    name: Construcción y despliegue simulado
    needs: [test, security]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir imagen del microservicio
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: pagos-svc:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Analizar vulnerabilidades de la imagen
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$HOME/.cache:/root/.cache" \
            aquasec/trivy:0.67.2 image --scanners vuln --severity HIGH,CRITICAL \
            --ignore-unfixed --exit-code 1 pagos-svc:${{ github.sha }}

      - name: Desplegar en entorno cloud simulado con Docker Compose
        env:
          IMAGE_TAG: ${{ github.sha }}
          PORT: '8080'
        run: |
          docker compose up -d --build
          echo "Esperando que pagos-svc responda..."
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:8080/ > /dev/null; then
              echo "Despliegue correcto: la aplicación responde por HTTP."
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "La aplicación no respondió a tiempo."
              docker compose logs
              exit 1
            fi
            sleep 3
          done
          curl --fail --silent http://localhost:8080/api/pagos
          echo
          echo "Commit desplegado: ${{ github.sha }}"

      - name: Guardar logs de despliegue
        if: always()
        run: docker compose logs --no-color > deployment-logs.txt 2>&1 || true

      - name: Publicar evidencia del despliegue
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencia-despliegue-${{ github.sha }}
          path: deployment-logs.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Detener entorno simulado
        if: always()
        run: docker compose down --remove-orphans
