name: Hola Mundo CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  saludo:
    name: Saludo de verificacion
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4
      - name: Saludar
        run: |
          echo "Hola Mundo desde GitHub Actions"
          echo "Repositorio: $GITHUB_REPOSITORY"
          echo "Ref/rama: $GITHUB_REF_NAME"
          echo "Ejecutado por: $GITHUB_ACTOR"
      - name: Mostrar fecha
        run: date

  pruebas:
    name: Pruebas y cobertura
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4
      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Ejecutar verificacion Maven
        run: ./mvnw --batch-mode clean verify
