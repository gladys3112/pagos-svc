<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagos | Microservicio de pagos</title>
    <style>
        :root {
            color-scheme: light;

            margin: 0;

        }
